<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reuniones de Indicadores – Presentaciones semanales</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1224;color:#e8edff;font-family:"Segoe UI",system-ui,sans-serif}
.wrap{max-width:1280px;margin:0 auto;padding:36px 22px 60px}
h1{margin:0;font-size:clamp(24px,3vw,34px);font-weight:800;letter-spacing:-.01em}
.sub{color:#8fa0d8;margin:6px 0 26px}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;margin-bottom:22px}
input{background:#121c3a;border:1px solid #2a3768;color:#fff;border-radius:10px;padding:10px 14px;font-size:15px;width:min(340px,100%)}
.hero{display:grid;grid-template-columns:1.4fr 1fr;gap:26px;background:linear-gradient(135deg,#14214a,#101a38);border:1px solid #24336a;border-radius:18px;padding:18px;margin-bottom:34px;text-decoration:none;color:inherit}
.hero img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:10px;background:#fff;display:block}
.hero .k{color:#5aa2ff;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.hero h2{font-size:clamp(22px,2.6vw,32px);margin:8px 0 10px}
.hero .meta{color:#9aa8d8;margin-bottom:22px}
.btn{display:inline-block;background:#1565d8;color:#fff;padding:12px 22px;border-radius:10px;font-weight:700;text-decoration:none}
.hero:hover .btn{background:#2a78ef}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
.card{background:#121c3a;border:1px solid #22305f;border-radius:14px;overflow:hidden;text-decoration:none;color:inherit;transition:transform .2s,border-color .2s}
.card:hover{transform:translateY(-3px);border-color:#3c5bb0}
.card img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:#fff}
.card .b{padding:12px 14px}
.card h3{margin:0 0 4px;font-size:16px}
.card .m{color:#8fa0d8;font-size:13px}
.pill{display:inline-block;background:#1f2d5e;color:#9cc0ff;border-radius:20px;padding:2px 9px;font-size:12px;margin-left:6px}
h4{color:#8fa0d8;font-weight:600;font-size:13px;letter-spacing:.08em;text-transform:uppercase;margin:0 0 14px}
@media (max-width:760px){.hero{grid-template-columns:1fr}}
</style></head><body><div class="wrap">
<div class="top"><div><h1>Reuniones de Indicadores</h1><p class="sub">Presentaciones semanales de consumo y ahorro de energía</p></div>
<input id="q" placeholder="Buscar semana…" aria-label="Buscar semana"></div>
<div id="hero"></div><h4>Todas las semanas</h4><div class="grid" id="list"></div></div>
<script>
const fmt=f=>{if(!f)return"";const d=new Date(f+"T12:00:00");return d.toLocaleDateString("es-MX",{day:"numeric",month:"long",year:"numeric"})};
fetch("presentaciones.json",{cache:"no-cache"}).then(r=>r.json()).then(({presentaciones:P})=>{
  const meta=p=>`${p.diapositivas} diapositivas${p.interactivas?` <span class="pill">${p.interactivas} interactivas</span>`:""}`;
  const h=P[0];if(h)document.getElementById("hero").outerHTML=`<a class="hero" href="${h.url}"><img src="${h.portada}" alt=""><div><div class="k">Más reciente</div><h2>${h.titulo}</h2><div class="meta">${fmt(h.fecha)} · ${meta(h)}</div><span class="btn">▶ Presentar</span></div></a>`;
  const L=document.getElementById("list");
  const draw=q=>{L.innerHTML=P.filter(p=>(p.titulo+" "+p.id).toLowerCase().includes(q)).map(p=>`<a class="card" href="${p.url}"><img loading="lazy" src="${p.portada}" alt=""><div class="b"><h3>${p.titulo}</h3><div class="m">${fmt(p.fecha)} · ${meta(p)}</div></div></a>`).join("")||'<p class="sub">Sin resultados.</p>'};
  draw("");document.getElementById("q").oninput=e=>draw(e.target.value.toLowerCase().trim());
});
</script></body></html>
